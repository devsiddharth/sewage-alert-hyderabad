name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  build-and-push:

    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # 2. Set up Java 25
      # ---------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ---------------------------------------------------------
      # 3. Verify complete Maven reactor
      # ---------------------------------------------------------
      - name: Build and test backend
        run: mvn --batch-mode clean verify

      # ---------------------------------------------------------
      # 4. Log in to Docker Hub
      # ---------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # 5. Set up Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 6. Build and push Eureka Server
      # ---------------------------------------------------------
      - name: Build and push Eureka Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./eureka-server/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/eureka-server:latest
            ${{ env.DOCKERHUB_USERNAME }}/eureka-server:${{ github.sha }}

      # ---------------------------------------------------------
      # 7. Build and push API Gateway
      # ---------------------------------------------------------
      - name: Build and push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/api-gateway:latest
            ${{ env.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}

      # ---------------------------------------------------------
      # 8. Build and push Auth Service
      # ---------------------------------------------------------
      - name: Build and push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:latest
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:${{ github.sha }}

      # ---------------------------------------------------------
      # 9. Build and push User Service
      # ---------------------------------------------------------
      - name: Build and push User Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./user-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/user-service:latest
            ${{ env.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}

      # ---------------------------------------------------------
      # 10. Build and push Complaint Service
      # ---------------------------------------------------------
      - name: Build and push Complaint Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./complaint-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/complaint-service:latest
            ${{ env.DOCKERHUB_USERNAME }}/complaint-service:${{ github.sha }}

      # ---------------------------------------------------------
      # 11. Build and push Community Service
      # ---------------------------------------------------------
      - name: Build and push Community Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./community-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/community-service:latest
            ${{ env.DOCKERHUB_USERNAME }}/community-service:${{ github.sha }}

      # ---------------------------------------------------------
      # 12. Build and push Notification Service
      # ---------------------------------------------------------
      - name: Build and push Notification Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./notification-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/notification-service:latest
            ${{ env.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}