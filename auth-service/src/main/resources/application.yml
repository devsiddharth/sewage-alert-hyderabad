server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:sewagealert_auth
    driver-class-name: org.h2.Driver
    username: root
    password: NewRoot@123

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # RabbitMQ: Broker used to publish user-auth domain events (USER_REGISTERED, EMAIL_VERIFIED)
  # consumed by the Notification Service. Publishing is fire-and-forget — a broker outage never
  # blocks registration/verification (failures are logged by the producer).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

app:
  jwt:
    secret: c2V3YWdlLWFsZXJ0LWh5ZGVyYWJhZC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI2
    expiration-ms: 86400000
  # Email verification token lifetime — the link inside the verification email expires
  # after this many minutes.
  verification:
    token-ttl-minutes: ${VERIFICATION_TOKEN_TTL_MINUTES:30}
  # Notification event publishing configuration
  rabbitmq:
    exchange: notification.exchange
  admin:
    name: Administrator
    email: admin@sewagealert.com
    password: Admin@123
  field-officers:
    accounts:
      - name: Ravi Kumar
        email: ravi.officer@sewagealert.com
        password: Officer@123
      - name: Suresh Reddy
        email: suresh.officer@sewagealert.com
        password: Officer@123
      - name: Anil Sharma
        email: anil.officer@sewagealert.com
        password: Officer@123

logging:
  level:
    com.sewagealert.auth: DEBUG
    org.springframework.security: INFO