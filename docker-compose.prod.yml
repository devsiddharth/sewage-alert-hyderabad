# =============================================================================
# Sewage Alert Hyderabad — production Docker Compose
#
# Pulls application images from Docker Hub.
# No application source is built on the deployment machine.
#
# Required secrets/configuration should be supplied through a deployment
# .env file. Do NOT commit real secrets.
# =============================================================================

name: sewage-alert-hyderabad

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  mysql:
    image: mysql:8.4
    container_name: sewagealert-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sewagealert-rabbitmq
    hostname: sewagealert-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Service discovery
  # ---------------------------------------------------------------------------

  eureka-server:
    image: devsiddhartha21/eureka-server:latest
    container_name: sewagealert-eureka-server
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API Gateway — the only application port exposed to the host
  # ---------------------------------------------------------------------------

  api-gateway:
    image: devsiddhartha21/api-gateway:latest
    container_name: sewagealert-api-gateway
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Auth service
  # ---------------------------------------------------------------------------

  auth-service:
    image: devsiddhartha21/auth-service:latest
    container_name: sewagealert-auth-service
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sewagealert_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      VERIFICATION_TOKEN_TTL_MINUTES: ${VERIFICATION_TOKEN_TTL_MINUTES:-30}
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # User service
  # ---------------------------------------------------------------------------

  user-service:
    image: devsiddhartha21/user-service:latest
    container_name: sewagealert-user-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sewagealert_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Complaint service
  # ---------------------------------------------------------------------------

  complaint-service:
    image: devsiddhartha21/complaint-service:latest
    container_name: sewagealert-complaint-service
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sewagealert_complaints?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Community service
  # ---------------------------------------------------------------------------

  community-service:
    image: devsiddhartha21/community-service:latest
    container_name: sewagealert-community-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sewagealert_community?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Notification service
  # ---------------------------------------------------------------------------

  notification-service:
    image: devsiddhartha21/notification-service:latest
    container_name: sewagealert-notification-service
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sewagealert_notifications?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:?EMAILJS_SERVICE_ID is required}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:?EMAILJS_TEMPLATE_ID is required}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:?EMAILJS_PUBLIC_KEY is required}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:?EMAILJS_PRIVATE_KEY is required}
      EMAILJS_WELCOME_TEMPLATE_ID: ${EMAILJS_WELCOME_TEMPLATE_ID:-}
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data: